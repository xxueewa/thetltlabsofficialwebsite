[project]
name = "tltzwebsite"
version = "0.1.0"
description = "Main website for the tlt labs"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "gunicorn>=22.0",
    "scipy-stubs~=1.18.1",
    "whitenoise>=6.5",
    "psycopg[binary]>=3.1",
    "pillow>=13.0.0",
    "django-cloudinary-storage>=0.3",
    "dj-database-url>=2.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["pages"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
]
